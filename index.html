<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
            Tightened from the old policy (default-src * 'unsafe-inline' 'unsafe-eval'),
            which let scripts/styles load from ANY origin and allowed eval() - that
            effectively disabled CSP as a defense. This restricts everything to this
            origin only.
            img-src allows any https:// source (not just api.qrserver.com) because the
            Branding page lets an admin set a hero image, logo, and custom menu-item
            icons from arbitrary URLs - those are admin-trusted content, not
            user-submitted, so allowing https broadly here is a deliberate tradeoff
            rather than an oversight. http:// (unencrypted) sources are still blocked.
            script-src and style-src still need 'unsafe-inline' because this codebase
            uses onclick="..."/style="..." attributes throughout every dynamically
            generated screen (menu, checkout, admin, kitchen) rather than
            addEventListener - removing unsafe-inline would break all of those clicks.
            Fully closing that gap means migrating every onclick attribute to
            addEventListener + CSS classes; flagging it here as the next hardening
            step rather than doing a full UI rewrite under this change.
            Clickjacking protection is handled instead by the X-Frame-Options header
            server.js sends - the frame-ancestors directive doesn't work in a <meta>
            tag, only in a real HTTP header.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';" />
        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/iconsvg.css" />
        <link rel="stylesheet" href="css/cat.css" />
        <title>Seven Bits Coffee // Hazaribagh</title>
    </head>
    <body>
        <!-- SYSTEM NAVIGATION: Persistent header for page switching -->
        <nav class="system-nav">
            <img id="site-logo" src="" alt="" style="display:none; height: 28px; margin-right: 8px; align-self: center;" />
            <button onclick="showPage('home')">HOME</button>
            <button onclick="showPage('menu')">MENU</button>
            <button onclick="showPage('arcade')">ARCADE</button>
            <button id="nav-kitchen" onclick="showPage('kitchen')" style="display:none;">ORDERS</button>
            <button id="nav-admin" onclick="showPage('admin')" style="display:none;">ADMIN</button>
            <button id="nav-timeclock" onclick="window.handleTimeclockClick()" style="display:none; margin-left:auto;"></button>
            <button id="nav-account" onclick="window.handleAccountClick()" style="margin-left:auto;">LOGIN</button>
        </nav>

        <!-- PAGE: HOME (Landing section with hero logo and story) -->
        <div id="page-home" class="page active">
            <!-- Ambient animated backdrop for the hero - pure CSS, no images/deps -->
            <div class="hero-backdrop" aria-hidden="true"></div>

            <div class="hero-section">
                <div class="icon-logo icon-logo-hero hero-reveal" style="animation-delay: 0s;"></div>
                <h1 class="hero-reveal" id="hero-shop-name" style="animation-delay: 0.1s;">SEVEN BITS COFFEE</h1>
                <p class="story-text hero-reveal" id="hero-tagline" style="animation-delay: 0.2s;">
                    Born from love for Physics, Coffee, a cat named Ginger and an obssesion with the number seven. We
                    don't just brew; we process flavor with low-latency precision.
                </p>
                <button class="btn-primary btn-glitch hero-reveal" style="animation-delay: 0.3s;" onclick="showPage('menu')">
                    <span data-text="ORDER NOW">ORDER NOW</span>
                </button>
                <div class="pixel-kitty-container">
                    <!-- The Mover handles screen travel, tripping, and flipping -->
                    <div class="kitty-mover">
                        <!-- Cat 1: Walking on two legs -->
                        <div class="kitty-biped"></div>

                        <!-- Cat 2: Walking on four legs -->
                        <div class="kitty-quad"></div>

                        <!-- The randomized held item (coffee/food icon) - id="held-item" is
                             required here, not just class="latte-cup": cat.css defines a
                             dedicated #held-item rule (small 20x20 box positioned in the
                             cat's paw, its own item-fly animation) separate from the older
                             fixed-size .latte-cup layer. Using #held-item is what lets
                             app.js's icon-randomizing script (below) swap which icon shows -
                             .latte-cup alone would only ever display one fixed cup and
                             wouldn't respond to the randomizer at all. -->
                        <div id="held-item"></div>
                    </div>
                </div>

                <!-- Live ticker - real numbers from the server, not decorative fakery -->
                <div id="live-stats-ticker" class="live-stats-ticker hero-reveal" style="animation-delay: 0.4s;"></div>
            </div>

            <!-- A few featured items so the home page has something to browse/click
                 right away, not just a hero banner over empty space -->
            <div class="popular-picks-section">
                <h3>POPULAR PICKS</h3>
                <div id="popular-picks-grid" class="popular-picks-grid"></div>
            </div>

            <!-- Shows the signed-in customer's/guest's most recent ACTIVE order + live
                 status - hidden entirely (see refreshOrderStatusWidget in app.js) unless
                 there's actually something to show, rather than showing an empty prompt. -->
            <div id="order-status-section" class="order-status-section" style="max-width: 420px; margin: 20px auto; padding: 0 15px; display: none;">
                <h3 style="font-size: 10pt; letter-spacing: 1px; color: var(--color-accent); margin-bottom: 10px;">YOUR ORDER</h3>
                <div id="order-status-root"></div>
            </div>
            <div id="my-orders-link-section" style="max-width: 420px; margin: 10px auto; padding: 0 15px; display: none; text-align:center;">
                <button onclick="window.openMyOrders()" style="background:none; border:1px solid var(--color-accent); color: var(--color-accent); font-size: 8pt; padding: 8px 16px; cursor:pointer; font-family: 'Courier New', monospace; text-transform: uppercase;">MY ORDERS &amp; REORDER</button>
            </div>

            <!-- Store details footer - content populated from admin Branding settings -->
            <footer id="site-footer" class="site-footer"></footer>
        </div>

        <!-- PAGE: MENU (Dynamic menu rendering with view toggles) -->
       <!-- PAGE: MENU -->
<div id="page-menu" class="page">
    <div class="menu-controls" style="padding: 10px; display: flex; justify-content: flex-end; align-items:center; gap: 15px">
    <label id="favorites-filter-label" onclick="window.toggleFavoritesFilter()" style="display:none; align-items:center; gap:5px; font-size: 8pt; color: var(--color-text-muted); cursor:pointer; font-family: 'Courier New', monospace; user-select:none;">
        <span id="favorites-filter-star" style="font-size:11pt; line-height:1; color: var(--color-text-muted);">&#9734;</span> FAVORITES ONLY
    </label>
    <!-- Search is wired via window.initSearchBar() in app.js (debounced), not an inline
         handler - the old oninput="renderMenu(...)" called a function that was never
         attached to window, so it silently errored on every keystroke. -->
    <input type="text" id="menu-search" placeholder="SEARCH_BITS..."
           style="background: black; border: 1px solid #333; color: #d97706; padding: 5px 10px; font-family: 'Courier New';">
    
    <button class="btn-view-toggle" onclick="window.setViewMode('list')">
        <span class="icon icon-hamburger"></span>
    </button>
    <button class="btn-view-toggle" onclick="window.setViewMode('grid')">
        <span class="icon icon-grid"></span>
    </button>
</div>

    <div id="menu-root"></div>

   
    <!-- UNIFIED ACTION FOOTER -->
<div id="footer-actions" class="footer-container" style="display: none;">
    
    <!-- JUMP MENU (NESTED INSIDE) -->
    <!-- This now follows the footer's sticky position and 500px max-width -->
    <div id="jump-menu" class="jump-overlay">
        <div class="jump-header">CATEGORIES:</div>
        <div id="jump-options-container">
            <!-- Options injected by JS -->
        </div>
    </div>

    <!-- CART BAR -->
    <div id="cart-status" class="cart-bar" onclick="window.handleCartStatusClick()">
        <span>BITS IN CART:</span>
        <span id="cart-count">0</span>
    </div>
    
    <!-- JUMP BUTTON -->
    <button class="btn-jump-fab" onclick="window.toggleJumpMenu(event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3">
            <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
    </button>
</div>

    <div id="jump-menu" class="jump-overlay"></div>
</div>

        <!-- PAGE: ARCADE (in-store games, unlocked after placing an order) -->
        <div id="page-arcade" class="page">
            <div id="arcade-root" style="max-width: 1400px; margin: 0 auto; padding: 20px;"></div>
        </div>

        <!-- PAGE: ORDERS (Kitchen Display System / KOT Management) -->
        <div id="page-kitchen" class="page">
            <!-- Station tabs restyled to match the admin panel's sub-tab look.
                 TABLES/TABS sits here too (not a separate toggle button) since
                 it's another way of tracking active orders - just grouped by
                 table instead of by station. -->
            <div class="kitchen-tabs admin-tabs">
                <button class="admin-tab-btn active" data-station="MASTER" onclick="filterKitchen('MASTER')">ALL STATIONS</button>
                <button class="admin-tab-btn" data-station="BARISTA" onclick="filterKitchen('BARISTA')">BARISTA</button>
                <button class="admin-tab-btn" data-station="KITCHEN" onclick="filterKitchen('KITCHEN')">KITCHEN</button>
                <button class="admin-tab-btn" data-station="DESSERTS" onclick="window.filterKitchen('DESSERTS')">DESSERTS</button>
                <button class="admin-tab-btn" data-station="TABLES" onclick="window.filterKitchen('TABLES')">TABLES / TABS</button>
            </div>

            <!-- Active vs. history filter + date sort - not relevant to the Tables view -->
            <div class="kitchen-toolbar" id="kitchen-status-toolbar">
                <div class="kitchen-status-filter">
                    <button class="admin-btn active" data-status-filter="active" onclick="window.setKitchenStatusFilter('active')">ACTIVE</button>
                    <button class="admin-btn" data-status-filter="history" onclick="window.setKitchenStatusFilter('history')">HISTORY</button>
                    <button class="admin-btn" data-status-filter="all" onclick="window.setKitchenStatusFilter('all')">SHOW ALL</button>
                </div>
                <select id="kitchen-sort" onchange="window.setKitchenSort(this.value)"
                    style="background:var(--color-bg); border:1px solid var(--color-border); color:var(--color-text); padding:8px 10px; font-family:inherit; font-size:8pt;">
                    <option value="newest">NEWEST FIRST</option>
                    <option value="oldest">OLDEST FIRST</option>
                </select>
            </div>

            <!-- Postpaid table tabs - staff open/close these to group multiple
                 orders into one combined bill. Only visible when the
                 TABLES/TABS tab above is selected. -->
            <div id="tables-panel-root" style="display:none; margin-bottom:20px;"></div>

            <!-- Target for dynamic KOT ticket injection -->
            <div id="kitchen-orders-root"></div>
        </div>

        <!-- PAGE: ADMIN (System configuration and menu repository) -->
        <div id="page-admin" class="page">
            <div class="admin-wrapper">
                <header class="admin-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h1 style="margin:0;">SYSTEM CONFIGURATION</h1>
                    <button class="admin-btn-secondary" onclick="AdminPortal.logout()">LOGOUT</button>
                </header>

                <!-- Sub-tab nav: Global Settings / Menu Items / User Management / Branding -->
                <div id="admin-tabs" class="admin-tabs"></div>
                <div id="admin-tab-content"></div>
            </div>
        </div>

        <!-- Randomizes which icon the walking cat is "holding" each time its
             15s walk-and-tumble animation loop restarts. Needs to run after
             the pixel-kitty-container markup above (for getElementById to
             find #held-item) but before app.js, which is just where it's
             placed - a plain non-module script always runs synchronously as
             the parser reaches it, so no DOMContentLoaded wrapper is needed
             here since the container HTML is already above it in the file. -->
        <script>
            const itemClasses = [
                'icon-americano',
                'icon-matcha-drink',
                'icon-cookie',
                'icon-ice-cream',
                'icon-ice-latte',
                'icon-latte-svg'
            ];
            const heldItem = document.getElementById('held-item');
            const mover = document.querySelector('.kitty-mover');

            function randomizeItem() {
                heldItem.classList.remove(...itemClasses);
                const randomClass = itemClasses[Math.floor(Math.random() * itemClasses.length)];
                heldItem.classList.add(randomClass);
            }

            randomizeItem(); // give the cat a random item immediately on page load

            mover.addEventListener('animationiteration', (event) => {
                // .kitty-mover actually runs several looping animations (opacity
                // toggles, flip physics) that also fire 'animationiteration' -
                // only re-randomize on the one that represents a full walk cycle.
                if (event.animationName === 'move-and-tumble') {
                    randomizeItem();
                }
            });
        </script>

        <!-- Main JS entry point (Module type required for ES6 imports) -->
        <script type="module" src="js/app.js"></script>
    </body>
</html>
